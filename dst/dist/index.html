<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>4D Engine WebGL</title>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: #000;
                font-family: sans-serif;
            }
            canvas {
                display: block;
                width: 100vw;
                height: 100vh;
            }
            #info {
                position: absolute;
                top: 8px;
                left: 8px;
                color: #fff;
                font-size: 12px;
                background: rgba(0, 0, 0, 0.4);
                padding: 6px 10px;
                border-radius: 4px;
                pointer-events: none;
            }
        </style>
    </head>
    <body>
        <canvas id="glcanvas"></canvas>
        <div id="info">LMB drag: 4D rotate · Shift+drag: pan · Wheel: zoom</div>
        <script type="module" src="/bundle.js"></script>
    </body>
</html>
